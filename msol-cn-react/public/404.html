<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // GitHub Pages SPA fallback
    // 保存完整路径到 sessionStorage，跳转到 base path 让 React Router 接管
    var base = '/msol-cn/';
    var path = window.location.pathname;
    // 去掉 base 前缀得到 SPA 路由路径
    if (path.indexOf(base) === 0) {
      var route = path.slice(base.length);
      sessionStorage.setItem('spa-redirect', '/' + route);
    }
    window.location.replace(base);
  </script>
</head>
<body></body>
</html>
